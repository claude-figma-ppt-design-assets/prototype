<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  :root{ --line:#e4e4ea; --txt:#1c1c22; --muted:#86868f; --accent:#7c5cff; --danger:#e0484d; }
  *{ box-sizing:border-box; } body{ margin:0; font:13px/1.5 'Inter',-apple-system,system-ui,sans-serif; color:var(--txt); background:#fff; }
  .tabs{ display:flex; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:5; }
  .tab{ flex:1; padding:13px; text-align:center; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.on{ color:var(--accent); border-bottom-color:var(--accent); }
  .pane{ padding:14px 16px; display:none; } .pane.on{ display:block; }
  h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }
  label{ display:block; font-size:11px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea{ width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fafafa; font-family:inherit; }
  textarea{ resize:vertical; }
  .seg{ display:flex; gap:6px; margin-bottom:6px; } .seg button{ flex:1; padding:8px; border:1px solid var(--line); border-radius:8px; background:#f4f4f6; font-weight:600; cursor:pointer; font-size:12px; } .seg button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .status{ background:#f0eefe; color:#5b43d6; border-radius:8px; padding:9px 10px; font-size:12px; font-weight:600; margin:8px 0; }
  .err{ background:#ffeaea; color:#a01; border:1px solid #ffc9c9; border-radius:8px; padding:8px 10px; font-size:12px; margin:8px 0; display:none; }
  .btn{ width:100%; padding:11px; border:1px solid var(--line); border-radius:9px; background:#f3f3f6; font-weight:700; cursor:pointer; font-size:13px; margin-top:12px; }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); } .btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); } .btn.sm{ padding:6px 9px; width:auto; font-size:11px; margin:0; }
  .item{ display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px; }
  .thumb{ flex:0 0 auto; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .meta{ flex:1; min-width:0; } .meta .nm{ font-weight:700; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta .sub{ font-size:11px; color:var(--muted); margin-top:2px; } .tag{ font-size:10px; background:#eef0f4; color:#667; padding:1px 6px; border-radius:5px; margin-right:3px; }
  .empty{ color:var(--muted); font-size:12px; padding:14px 0; }
  .exp{ margin-top:10px; } .exprow{ display:flex; gap:8px; }
  textarea.code{ height:120px; font:11px/1.4 ui-monospace,Menlo,monospace; background:#0f1117; color:#d7e0ff; }
  .count{ font-size:11px; background:#eef0f4; color:#667; padding:1px 7px; border-radius:6px; }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab on" data-tab="reg">➕ 등록</div>
    <div class="tab" data-tab="lib">📚 라이브러리</div>
  </div>

  <!-- 등록 -->
  <div class="pane on" id="paneReg">
    <div class="seg" id="modeSeg">
      <button data-mode="template" class="on">템플릿 (여러 페이지)</button>
      <button data-mode="element">요소 (단일)</button>
    </div>
    <div class="status" id="selStatus">선택된 프레임: 0개</div>
    <div class="err" id="err"></div>

    <div id="fTpl">
      <label>템플릿 이름</label><input id="tName" placeholder="예: 정부지원 사업계획서" />
      <label>문서 종류</label>
      <select id="tDoc"><option>사업계획서</option><option>IR Deck</option><option>제안서</option><option>기타</option></select>
      <label>태그 (쉼표로 구분)</label><input id="tTags" placeholder="예비창업패키지, 정부지원사업, 창업" />
      <label>설명 (선택)</label><input id="tDesc" placeholder="간단 설명" />
      <button class="btn primary" id="btnTpl">템플릿 등록 (선택 프레임 = 페이지들)</button>
    </div>

    <div id="fEl" style="display:none">
      <label>요소 이름</label><input id="eName" placeholder="예: 통계 카드" />
      <label>카테고리</label>
      <select id="eCat"><option>통계</option><option>텍스트</option><option>강조</option><option>도형</option><option>리스트</option><option>기타</option></select>
      <label>태그 (쉼표로 구분)</label><input id="eTags" placeholder="카드, 통계, 지표" />
      <button class="btn primary" id="btnEl">요소 등록 (선택 프레임 1개)</button>
    </div>
  </div>

  <!-- 라이브러리 -->
  <div class="pane" id="paneLib">
    <h3>템플릿 <span class="count" id="cT">0</span></h3>
    <div id="listT"></div>
    <h3>요소 <span class="count" id="cE">0</span></h3>
    <div id="listE"></div>

    <div class="exp">
      <h3>내보내기 / 동기화</h3>
      <div class="exprow"><button class="btn sm primary" id="copyLib">📋 library.js 스니펫 복사</button><button class="btn sm" id="dlLib">⬇ JSON 다운로드</button><button class="btn sm danger" id="clearLib">전체 비우기</button></div>
      <div class="exprow" style="margin-top:8px"><input id="beUrl" placeholder="https://<프로젝트>.vercel.app/api/library" style="flex:1"><button class="btn sm primary" id="sendBe" style="flex:0 0 96px">🚀 앱에 동기화</button></div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">동기화하면 웹앱이 시작할 때 등록한 템플릿·요소를 자동으로 불러옵니다.</div>
      <textarea class="code" id="out" readonly spellcheck="false" style="margin-top:8px"></textarea>
    </div>
  </div>

<script>
let MODE='template', LIB={templates:[],elements:[]};
let SYNC_URL='', REMOTE={templates:[],elements:[]};   // 저장된 동기화 URL / 온라인(KV) 사본
function notify(msg){ parent.postMessage({pluginMessage:{type:'notify',msg}},'*'); }
function syncUrl(){ const v=$('beUrl')?$('beUrl').value.trim():''; return v||SYNC_URL; }
function mergeId(a,b){ const m=new Map(); (a||[]).forEach(x=>x&&x.id&&m.set(x.id,x)); (b||[]).forEach(x=>{ if(x&&x.id&&!m.has(x.id)) m.set(x.id,x); }); return [...m.values()]; }
async function pullRemote(){ const u=syncUrl(); if(!u)return; try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok){ const j=await r.json(); REMOTE={templates:j.templates||[],elements:j.elements||[]}; renderLib(); } }catch(_){} }
async function removeItem(kind,id){
  parent.postMessage({pluginMessage:{type:'delete',kind,id}},'*');   // 로컬(clientStorage) 삭제
  const u=syncUrl();
  if(!u){ notify('동기화 URL이 없어 온라인에서 삭제하지 못했어요. 등록 탭에 URL을 입력해 주세요.'); return; }
  try{ const r=await fetch(u+'?kind='+kind+'&id='+encodeURIComponent(id),{method:'DELETE'}); notify(r.ok?'삭제 완료 (온라인 포함) ✓':'온라인 삭제 실패: '+r.status); }
  catch(e){ notify('온라인 삭제 실패: '+e.message); }
  await pullRemote();   // 온라인 최신 상태로 목록 갱신
}
const $=id=>document.getElementById(id);
function stamp(){ return Math.random().toString(36).slice(2,8); }

// 탭/모드
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); $('paneReg').classList.toggle('on',t.dataset.tab==='reg'); $('paneLib').classList.toggle('on',t.dataset.tab==='lib'); });
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b)); $('fTpl').style.display=MODE==='template'?'':'none'; $('fEl').style.display=MODE==='element'?'':'none'; });

// 미리보기 렌더
function mini(box, model, W){ const sc=W/model.w; box.style.cssText='position:relative;overflow:hidden;background:'+(model.bg||'#fff')+';width:'+W+'px;height:'+(model.h*sc)+'px'; const inner=document.createElement('div'); inner.style.cssText='position:absolute;left:0;top:0;width:'+model.w+'px;height:'+model.h+'px;transform-origin:top left;transform:scale('+sc+')';
  for(const s of (model.statics||[])){ const d=document.createElement('div'); d.style.position='absolute'; d.style.left=s.x+'px'; d.style.top=s.y+'px'; d.style.width=s.w+'px'; d.style.height=s.h+'px';
    if(s.type==='rect'){ d.style.background=s.fill; d.style.borderRadius=(s.radius||0)+'px'; if(s.line)d.style.border=s.line.w+'px solid '+s.line.color; if(s.img){ d.style.backgroundImage="url('"+s.img+"')"; d.style.backgroundSize='cover'; d.style.backgroundPosition='center'; } }
    else { d.style.color=s.color; d.style.fontSize=s.size+'px'; d.style.fontWeight=s.weight; d.style.textAlign=s.align; d.style.lineHeight=s.lh; d.style.overflow='hidden'; d.style.whiteSpace='pre-wrap'; d.style.wordBreak='keep-all'; d.style.display='flex'; d.style.flexDirection='column'; d.style.justifyContent=(s.valign==='middle'?'center':(s.valign==='bottom'?'flex-end':'flex-start')); d.textContent=s.text; }
    inner.appendChild(d); }
  box.innerHTML=''; box.appendChild(inner); }
// 미리보기: 등록된 이미지(preview)가 있으면 이미지로, 없으면 DOM 재구성(mini)
function thumbInto(box, model, W, preview){ if(preview){ const h=model.h*(W/model.w); box.style.cssText='position:relative;overflow:hidden;width:'+W+'px;height:'+h+'px;background:#fff url('+preview+') center/cover no-repeat'; box.innerHTML=''; } else { mini(box, model, W); } }

function renderLib(){
  const TPL=mergeId(LIB.templates,REMOTE.templates), ELE=mergeId(LIB.elements,REMOTE.elements);   // 로컬 ∪ 온라인
  $('cT').textContent=TPL.length; $('cE').textContent=ELE.length;
  const lt=$('listT'); lt.innerHTML=''; if(!TPL.length) lt.innerHTML='<div class="empty">아직 등록된 템플릿이 없습니다.</div>';
  TPL.forEach(tp=>{ const it=document.createElement('div'); it.className='item'; const th=document.createElement('div'); th.className='thumb'; thumbInto(th, tp.pages[0], 92, (tp.pages[0]&&tp.pages[0].preview)||tp.cover); const me=document.createElement('div'); me.className='meta'; me.innerHTML='<div class="nm">'+tp.name+'</div><div class="sub"><span class="tag">'+tp.docType+'</span><span class="tag">'+tp.size+'</span><span class="tag">'+tp.pages.length+'p</span>'+(tp.tags||[]).slice(0,2).map(t=>'<span class="tag">#'+t+'</span>').join('')+'</div>'; const del=document.createElement('button'); del.className='btn sm danger'; del.textContent='삭제'; del.onclick=()=>removeItem('template',tp.id); it.appendChild(th); it.appendChild(me); it.appendChild(del); lt.appendChild(it); });
  const le=$('listE'); le.innerHTML=''; if(!ELE.length) le.innerHTML='<div class="empty">아직 등록된 요소가 없습니다.</div>';
  ELE.forEach(el=>{ const it=document.createElement('div'); it.className='item'; const th=document.createElement('div'); th.className='thumb'; thumbInto(th, {w:el.w,h:el.h,bg:'#fff',statics:el.nodes}, 92, el.preview); const me=document.createElement('div'); me.className='meta'; me.innerHTML='<div class="nm">'+el.name+'</div><div class="sub"><span class="tag">'+el.category+'</span><span class="tag">'+el.w+'×'+el.h+'</span>'+(el.tags||[]).slice(0,2).map(t=>'<span class="tag">#'+t+'</span>').join('')+'</div>'; const del=document.createElement('button'); del.className='btn sm danger'; del.textContent='삭제'; del.onclick=()=>removeItem('element',el.id); it.appendChild(th); it.appendChild(me); it.appendChild(del); le.appendChild(it); });
  $('out').value = 'templates: '+JSON.stringify(TPL,null,2)+',\n\nelements: '+JSON.stringify(ELE,null,2);
}

// 등록 버튼
$('btnTpl').onclick=()=> parent.postMessage({pluginMessage:{type:'register-template', name:$('tName').value, docType:$('tDoc').value, tags:$('tTags').value, desc:$('tDesc').value, stamp:stamp()}},'*');
$('btnEl').onclick=()=> parent.postMessage({pluginMessage:{type:'register-element', name:$('eName').value, category:$('eCat').value, tags:$('eTags').value, stamp:stamp()}},'*');

// 내보내기
$('copyLib').onclick=async()=>{ try{ await navigator.clipboard.writeText($('out').value); }catch(_){ $('out').select(); document.execCommand('copy'); } };
$('dlLib').onclick=()=>{ const blob=new Blob([JSON.stringify(LIB,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ppt-library.json'; a.click(); };
$('clearLib').onclick=async()=>{ if(!confirm('등록된 모든 템플릿/요소를 비울까요? (온라인 포함)')) return; parent.postMessage({pluginMessage:{type:'clear-all'}},'*'); const u=syncUrl(); if(u){ try{ await fetch(u,{method:'DELETE'}); }catch(_){} } REMOTE={templates:[],elements:[]}; await pullRemote(); };
$('sendBe').onclick=async()=>{ const url=$('beUrl').value.trim(); if(!url){ alert('동기화 URL을 입력하세요. 예: https://<프로젝트>.vercel.app/api/library'); return; } SYNC_URL=url; parent.postMessage({pluginMessage:{type:'save-url',url}},'*'); try{ const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(LIB)}); const j=await res.json().catch(()=>({})); alert('앱에 동기화 완료 ✓ (템플릿 '+((j.counts&&j.counts.templates)??'?')+' · 요소 '+((j.counts&&j.counts.elements)??'?')+')'); await pullRemote(); }catch(e){ alert('동기화 실패: '+e.message); } };

onmessage=(e)=>{ const m=e.data.pluginMessage; if(!m)return;
  if(m.type==='state'){ $('selStatus').textContent='선택된 프레임: '+m.selCount+'개'+(m.selNames&&m.selNames.length?' ('+m.selNames.slice(0,3).join(', ')+(m.selNames.length>3?'…':'')+')':''); LIB=m.lib||{templates:[],elements:[]}; if(m.savedUrl){ SYNC_URL=m.savedUrl; if(!$('beUrl').value) $('beUrl').value=m.savedUrl; } renderLib(); pullRemote(); $('err').style.display='none'; }
  else if(m.type==='err'){ $('err').textContent='⚠ '+m.msg; $('err').style.display='block'; }
  else if(m.type==='registered'){ // 등록 즉시 자동 동기화
    const url=syncUrl(); if(!url){ notify('동기화 URL이 없어 자동 동기화를 건너뜀 — 등록 탭에 URL 입력'); return; }
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:m.kind,item:m.item})})
      .then(r=>{ notify(r.ok?'앱에 자동 동기화됨 ✓':'동기화 응답 '+r.status); pullRemote(); })
      .catch(e=>notify('자동 동기화 실패: '+e.message));
  }
};
parent.postMessage({pluginMessage:{type:'refresh'}},'*');
</script>
</body>
</html>
