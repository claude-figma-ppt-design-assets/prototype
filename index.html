<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPT 덱 빌더 · 사업자용 템플릿</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/SUIT/SUIT.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/NotoSansKR/NotoSansKR.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/SpoqaHanSansNeo/SpoqaHanSansNeo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/IBMPlexSansKR/IBMPlexSansKR.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/NanumSquareNeo/NanumSquareNeo.css">
<!-- 제목·디스플레이 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSans.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<!-- 필기체 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/GabiaSolmee/GabiaSolmee.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Danjunghae/Cafe24Danjunghae.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Oneprettynight/Cafe24Oneprettynight.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/BMYEONSUNG/BMYEONSUNG.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/HiMelody/HiMelody.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Gaegu:wght@300;400;700&family=Dongle:wght@300;400;700&display=swap">
<style>
  :root{
    --bar:#2b2b33; --panel:#1f1f26; --panel2:#191920; --line:#3a3a44; --txt:#e9e9ef; --muted:#9a9aa8; --accent:#7c5cff; --danger:#e0484d;
    --bg:#15151a; --btn:#33333d; --btnh:#3d3d49; --input:#2a2a32; --chip:#26262e; --thumb:#0d0d12; --card:#1a1a20; --row:#15151a; --sb:#43434f; --sbh:#5a5a68;
  }
  :root[data-theme="light"]{
    --bar:#ffffff; --panel:#f5f6f8; --panel2:#fafbfc; --line:#e2e4ea; --txt:#1c1f26; --muted:#7a7f8c; --accent:#7c5cff; --danger:#e0484d;
    --bg:#eceef3; --btn:#eceef3; --btnh:#e2e5ec; --input:#ffffff; --chip:#eef0f4; --thumb:#e6e9f0; --card:#ffffff; --row:#ffffff; --sb:#c4c8d2; --sbh:#a9aebb;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:'Freesentation','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif; transition:background-color .15s,color .15s; }
  /* 스크롤바 디자인 */
  *{ scrollbar-width:thin; scrollbar-color:var(--sb) transparent; }
  ::-webkit-scrollbar{ width:11px; height:11px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--sb); border-radius:8px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--sbh); background-clip:content-box; }
  ::-webkit-scrollbar-corner{ background:transparent; }
  .btn:disabled{ opacity:.35; cursor:default; }
  #topbar{ height:56px; display:flex; align-items:center; gap:12px; padding:0 16px; background:var(--bar); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; }
  #topbar h1{ font-size:15px; margin:0; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
  #topbar .sp{ flex:1; }
  .btn{ border:1px solid var(--line); background:var(--btn); color:var(--txt); padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  svg.ic{ width:16px; height:16px; flex:0 0 auto; display:inline-block; }
  #topbar h1{ display:inline-flex; align-items:center; gap:8px; }
  .btn:hover{ background:var(--btnh); } .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; } .btn.primary:hover{ background:var(--accent); filter:brightness(1.08); } .btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; } .btn.danger:hover{ background:var(--danger); filter:brightness(1.08); } .btn.sm{ padding:5px 9px; font-size:11px; }
  .palette{ display:flex; align-items:center; gap:6px; padding-left:8px; border-left:1px solid var(--line); } .palette small{ color:var(--muted); font-size:11px; }
  .sw{ width:22px; height:22px; border-radius:6px; border:1px solid rgba(255,255,255,.25); cursor:pointer; position:relative; } .sw input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  #main{ display:flex; height:calc(100% - 56px); background:var(--bg); }
  #pages{ width:188px; background:var(--panel2); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .ptitle{ padding:12px 14px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  #pageList{ flex:1; overflow:auto; padding:6px 10px; }
  .pageRow{ position:relative; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; cursor:grab; background:var(--row); overflow:hidden; }
  .pageRow:active{ cursor:grabbing; }
  .pageRow.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .pageRow.dragging{ opacity:.35; }
  .pageRow.dropbefore{ box-shadow:0 -3px 0 0 var(--accent) !important; }
  .pageRow.dropafter{ box-shadow:0 3px 0 0 var(--accent) !important; }
  .pthumb{ width:100%; position:relative; overflow:hidden; background:var(--thumb); }
  .prow-meta{ display:flex; align-items:center; justify-content:space-between; padding:5px 7px; font-size:11px; color:var(--muted); }
  .prow-meta .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:90px; }
  .ptools{ display:flex; gap:3px; } .ptool{ border:none; background:var(--input); color:var(--muted); width:20px; height:20px; border-radius:5px; font-size:11px; cursor:pointer; } .ptool:hover{ background:var(--btnh); color:#fff; }
  #center{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #stageWrap{ flex:1; overflow:auto; display:flex; align-items:safe center; justify-content:safe center; padding:24px; background:var(--bg); }
  #stageWrap.panmode, #stageWrap.panmode *{ cursor:grab !important; }
  #stageWrap.panning, #stageWrap.panning *{ cursor:grabbing !important; }
  #bottombar{ height:46px; flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--bar); border-top:1px solid var(--line); }
  #shortcuts{ position:fixed; inset:0; z-index:300; background:rgba(8,8,12,.55); display:none; align-items:flex-end; justify-content:center; }
  #shortcuts.open{ display:flex; }
  .scInner{ width:100%; max-width:1100px; max-height:72vh; margin-bottom:0; background:var(--panel); border:1px solid var(--line); border-bottom:none; border-radius:16px 16px 0 0; box-shadow:0 -16px 50px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; }
  .scHead{ padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  .scHead b{ font-size:16px; } .scHint{ font-size:11px; color:var(--muted); flex:1; }
  .scGrid{ padding:18px 22px 26px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px 28px; }
  .scCat{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin:12px 0 4px; grid-column:1/-1; }
  .scRow{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:6px 2px; font-size:13px; color:var(--txt); border-bottom:1px solid var(--line); }
  .scRow .keys{ display:flex; gap:4px; flex:0 0 auto; }
  .scRow kbd{ font:inherit; font-size:11px; font-weight:600; background:var(--btn); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:2px 7px; color:var(--txt); min-width:20px; text-align:center; }
  #startScreen{ position:fixed; inset:0; z-index:200; background:var(--bg); display:none; overflow:auto; }
  #startScreen.open{ display:block; }
  .startInner{ max-width:1120px; margin:0 auto; padding:52px 28px 64px; }
  .startHead{ text-align:center; margin-bottom:22px; }
  .startTitle{ font-size:26px; font-weight:800; color:var(--txt); }
  .startSub{ font-size:13px; color:var(--muted); margin-top:9px; }
  .startTop{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:26px; }
  .startTop .seg{ display:inline-flex; gap:6px; }
  .startGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; }
  .scard{ border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; background:var(--card); transition:transform .1s ease, box-shadow .1s ease; }
  .scard:hover{ outline:2px solid var(--accent); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .scard .sthumb{ width:100%; display:flex; justify-content:center; overflow:hidden; background:#fff; }
  .scard .sbody{ padding:10px 12px; }
  .scard .sbody .nm{ font-weight:700; font-size:13px; color:var(--txt); }
  .scard .sbody .ds{ font-size:11px; color:var(--muted); margin-top:3px; }
  #notesBar{ flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel); }
  #notesHead{ height:32px; display:flex; align-items:center; gap:7px; padding:0 14px; font-size:12px; font-weight:700; color:var(--txt); cursor:pointer; user-select:none; }
  #notesHead .sub{ font-weight:400; color:var(--muted); }
  #notesHead .tog{ display:inline-block; transition:transform .15s; color:var(--muted); }
  #notesBar.open #notesHead .tog{ transform:rotate(90deg); }
  #notesBody{ display:none; padding:0 14px 12px; }
  #notesBar.open #notesBody{ display:block; }
  #notesArea{ width:100%; height:110px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:10px; background:var(--input); color:var(--txt); font-size:13px; line-height:1.5; font-family:inherit; }
  #bottombar .bsp{ flex:1; }
  .bzoom{ display:flex; align-items:center; gap:8px; }
  .bzoom button, .bpage button{ width:28px; height:28px; border:1px solid var(--line); background:var(--btn); color:var(--txt); border-radius:7px; cursor:pointer; font-size:15px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
  .ptool{ display:inline-flex !important; align-items:center; justify-content:center; }
  #ctxMenu .mi>span:first-child{ display:inline-flex; align-items:center; gap:9px; }
  #ctxMenu .mi.hassub::after{ content:'›'; color:var(--muted); font-size:14px; }
  #ctxSub{ position:fixed; z-index:201; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:130px; box-shadow:0 12px 34px rgba(0,0,0,.45); display:none; }
  #ctxSub.open{ display:block; }
  #alignBtn{ display:inline-flex; align-items:center; gap:4px; }
  #alignMenu{ position:fixed; z-index:201; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:150px; box-shadow:0 12px 34px rgba(0,0,0,.45); display:none; }
  #alignMenu.open{ display:block; }
  #alignMenu .mi{ padding:8px 10px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--txt); }
  #alignMenu .mi:hover{ background:var(--btnh); }
  #alignMenu .mi>span{ display:inline-flex; align-items:center; gap:9px; }
  .el.gdrag{ outline:2px solid var(--accent); outline-offset:0; box-shadow:0 0 0 4px rgba(124,92,255,.28); z-index:50; }
  .bzoom button:hover, .bpage button:hover{ background:var(--btnh); }
  #zSlider{ width:140px; accent-color:var(--accent); cursor:pointer; }
  #zPct{ font-size:12px; color:var(--muted); min-width:42px; text-align:center; }
  #zFit{ width:auto !important; padding:0 10px; font-size:12px; font-weight:600; }
  .bpage{ display:flex; align-items:center; gap:8px; }
  #pInd{ font-size:12px; color:var(--txt); min-width:46px; text-align:center; }
  #stageScaler{ transform-origin:top center; position:relative; }
  #stage{ position:relative; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.5); overflow:hidden; }
  :root[data-theme="light"] #stage{ box-shadow:0 4px 18px rgba(0,0,0,.10); }
  .el{ position:absolute; } .el.text{ outline:none; } .el.selected{ box-shadow:0 0 0 2px var(--accent), 0 0 0 4px rgba(124,92,255,.3); }
  .marquee{ position:absolute; border:1px solid var(--accent); background:rgba(124,92,255,.14); pointer-events:none; z-index:6; }
  #ctxMenu{ position:fixed; z-index:200; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:178px; box-shadow:0 12px 34px rgba(0,0,0,.45); display:none; }
  #ctxMenu.open{ display:block; }
  #ctxMenu .mi{ padding:8px 10px; border-radius:7px; font-size:13px; cursor:pointer; color:var(--txt); display:flex; justify-content:space-between; align-items:center; gap:14px; }
  #ctxMenu .mi:hover{ background:var(--btnh); }
  #ctxMenu .mi .k{ color:var(--muted); font-size:11px; }
  #ctxMenu .sep{ height:1px; background:var(--line); margin:5px 2px; }
  .rsz{ position:absolute; background:#fff; border:1.5px solid var(--accent); border-radius:3px; z-index:8; box-shadow:0 1px 3px rgba(0,0,0,.35); }
  .selbox{ position:absolute; border:1.5px solid var(--accent); pointer-events:none; z-index:7; }
  #right{ position:relative; display:flex; flex:0 0 auto; }
  #rail{ width:64px; background:var(--panel2); border-left:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:2px; z-index:41; }
  .rbtn{ width:54px; padding:8px 2px; border:none; background:none; color:var(--muted); border-radius:10px; cursor:pointer; font-size:18px; display:flex; flex-direction:column; align-items:center; gap:3px; line-height:1; }
  .rbtn span{ font-size:10px; font-weight:600; }
  .rbtn svg{ width:21px; height:21px; display:block; }
  .rbtn:hover{ background:var(--btn); color:var(--txt); }
  .rbtn.on{ color:var(--accent); background:var(--btn); }
  #flyout{ width:300px; background:var(--panel); border-left:1px solid var(--line); display:none; flex-direction:column; overflow:hidden; }
  #flyout.open{ display:flex; }
  #flyout.float{ position:absolute; right:64px; top:0; bottom:0; box-shadow:-10px 0 28px rgba(0,0,0,.35); z-index:40; }
  .pane{ flex:1; overflow:auto; padding:14px; display:none; } .pane.on{ display:block; }
  .search{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--input); color:var(--txt); font-size:13px; margin-bottom:10px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{ padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:var(--chip); color:var(--muted); font-size:11px; cursor:pointer; } .chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .tcard{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); margin-bottom:12px; }
  .tthumb{ width:100%; position:relative; overflow:hidden; background:var(--thumb); }
  .tbody{ padding:9px 10px; } .tbody .nm{ font-size:13px; font-weight:700; } .tbody .ds{ font-size:11px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .tbody .tg{ margin-top:6px; display:flex; gap:4px; flex-wrap:wrap; } .badge{ font-size:10px; padding:1px 6px; border-radius:5px; background:var(--btn); color:var(--muted); } .badge.doc{ background:#2a3550; color:#9bb4ff; }
  .pal{ display:flex; gap:3px; margin-top:7px; } .pal i{ width:16px; height:16px; border-radius:4px; display:block; }
  .tbtns{ display:flex; gap:6px; margin-top:9px; } .tbtns .btn{ flex:1; }
  .egrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ecard{ border:1px solid var(--line); border-radius:9px; overflow:hidden; cursor:pointer; background:#fff; } .ecard:hover{ outline:2px solid var(--accent); }
  .ethumb{ width:100%; position:relative; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; }
  .ename{ padding:5px 7px; font-size:11px; font-weight:700; color:#1c1c22; background:#f2f2f4; }
  .addhint{ font-size:10px; color:var(--muted); text-align:center; margin:2px 0 10px; }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; font-weight:700; }
  .row{ margin-bottom:14px; } .row label{ display:block; color:var(--muted); font-size:11px; margin-bottom:5px; }
  .ctl{ display:flex; align-items:center; gap:8px; }
  .ctl input[type=color]{ width:40px; height:32px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; cursor:pointer; }
  .ctl input[type=number], .ctl select{ background:var(--input); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 8px; font-size:13px; width:100%; }
  .ctl .hex{ flex:1; background:var(--input); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 8px; font-size:12px; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:6px; background:var(--btn); font-size:11px; color:var(--muted); }
  .empty{ color:var(--muted); font-size:12px; line-height:1.7; }
  .cardbox{ border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:6px; }
  textarea{ width:100%; height:96px; border:1px solid var(--line); border-radius:8px; padding:9px; background:var(--input); color:var(--txt); font-size:13px; resize:vertical; font-family:inherit; }
  .aiNote{ font-size:10px; color:var(--muted); margin:6px 0 12px; }
  /* 템플릿 상세 모달 */
  #tplDetail{ position:fixed; inset:0; background:rgba(8,8,12,.9); z-index:120; display:none; align-items:center; justify-content:center; padding:30px; }
  #tplDetail.open{ display:flex; }
  .tdInner{ width:min(1120px,94vw); max-height:90vh; background:var(--panel); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  .tdHead{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tdHead b{ font-size:16px; } .tdHead .ds{ color:var(--muted); font-size:12px; margin-top:3px; }
  .tdGrid{ padding:20px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:16px; }
  .tdPage{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); cursor:pointer; position:relative; }
  .tdPage.sel{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .tdPage.sel .tdCap{ color:#bcb0ff; }
  .tdThumb{ width:100%; position:relative; overflow:hidden; background:var(--thumb); }
  .tdChk{ position:absolute; top:8px; left:8px; width:20px; height:20px; z-index:2; cursor:pointer; accent-color:var(--accent); }
  .tdCap{ padding:7px 9px; font-size:12px; font-weight:600; }
  .tdFoot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .tdAll{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; }
</style>
</head>
<body>
  <div id="topbar">
    <h1>📑 PPT 덱 빌더</h1>
    <div style="display:flex;gap:4px">
      <button class="btn sm" id="undoBtn" title="실행 취소 (⌘Z)">↶</button>
      <button class="btn sm" id="redoBtn" title="다시 실행 (⌘⇧Z)">↷</button>
    </div>
    <button class="btn sm" id="alignBtn" title="요소 정렬"></button>
    <span id="deckInfo" style="font-size:12px;color:var(--muted)"></span>
    <div class="palette" id="palette"><small>색상</small></div>
    <div class="sp"></div>
    <button class="btn" id="themeBtn" title="다크 / 화이트 전환">🌙</button>
    <button class="btn primary" id="pptxBtn">⬇ 덱 전체 PPTX</button>
  </div>
  <div id="main">
    <div id="pages">
      <div class="ptitle"><span>페이지</span><span id="pageCount" class="pill"></span></div>
      <div id="pageList"></div>
      <button class="btn" style="margin:8px 10px" id="addBlank">＋ 빈 페이지</button>
    </div>
    <div id="center">

wrap.addEventListener('wheel',(e)=>{
  if(e.ctrlKey||e.metaKey){ e.preventDefault(); zoomAt(Math.round(SCALE*100*Math.exp(-e.deltaY*0.0015)), e.clientX, e.clientY); return; }
  if(panMode) return;
  // 확대로 슬라이드가 화면보다 커서 스크롤 가능하면 → 일반 스크롤(페이지 전환 안 함)
  const scrollable = (wrap.scrollHeight-wrap.clientHeight>2) || (wrap.scrollWidth-wrap.clientWidth>2);
  if(scrollable) return;
  if(Math.abs(e.deltaY)<6 || Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
  e.preventDefault();
  if(wheelLock) return;
  if(e.deltaY>0){ if(current<DECK.length-1) selectPage(current+1); }
  else { if(current>0) selectPage(current-1); }
  wheelLock=true; setTimeout(()=>{ wheelLock=false; }, 420);
}, {passive:false});

// ===== PPTX (덱 전체) =====
const hx=c=>(c||'#000').replace('#','').toUpperCase();
// 보정(필터)만 구워서 dataURL — 투명도 유지 (블렌드 없는 이미지용)
function bakeImage(src,adj){ return new Promise((resolve)=>{ try{ const im=new Image(); im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=im.naturalWidth||im.width||1; c.height=im.naturalHeight||im.height||1; const cx=c.getContext('2d'); cx.filter=imgFilter(adj)||'none'; cx.drawImage(im,0,0,c.width,c.height); resolve(c.toDataURL('image/png')); }catch(_){ resolve(src); } }; im.onerror=()=>resolve(src); im.src=src; }catch(_){ resolve(src); } }); }
const hasAdj=(a)=>a&&Object.values(a).some(v=>+v);
function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
const rectHit=(a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
// 보정+블렌드를 뒤 배경/요소와 합성해 하나의 이미지로 평탄화 (블렌드 모드용)
async function bakeComposite(model,s){ const Q=2; const R={x:s.x,y:s.y,w:Math.max(1,s.w),h:Math.max(1,s.h)};
  const c=document.createElement('canvas'); c.width=Math.round(R.w*Q); c.height=Math.round(R.h*Q); const ctx=c.getContext('2d');
  ctx.fillStyle=model.bg||'#ffffff'; ctx.fillRect(0,0,c.width,c.height);   // 슬라이드 배경
  const idx=model.statics.indexOf(s);
  for(let i=0;i<idx;i++){ const b=model.statics[i]; if(b.type!=='rect')continue; if(!rectHit(R,{x:b.x,y:b.y,w:b.w,h:b.h}))continue; const dx=(b.x-R.x)*Q, dy=(b.y-R.y)*Q;
    ctx.save(); ctx.globalCompositeOperation=(b.blend&&b.blend!=='normal')?b.blend:'source-over';
    if(b.img){ const im=await loadImg(b.img); ctx.filter=imgFilter(b.adj)||'none'; if(im)ctx.drawImage(im,dx,dy,b.w*Q,b.h*Q); }
    else { ctx.filter='none'; ctx.fillStyle=b.fill||'#ffffff'; ctx.fillRect(dx,dy,b.w*Q,b.h*Q); }
    ctx.restore(); }
  const im=await loadImg(s.img); if(im){ ctx.save(); ctx.filter=imgFilter(s.adj)||'none'; ctx.globalCompositeOperation=(s.blend&&s.blend!=='normal')?s.blend:'source-over'; ctx.drawImage(im,0,0,c.width,c.height); ctx.restore(); }
  try{ return c.toDataURL('image/png'); }catch(_){ return s.img; }
}
document.getElementById('pptxBtn').onclick=async()=>{ finishEdit(); if(!DECK.length)return;
  const btn=document.getElementById('pptxBtn'); const old=btn.innerHTML; btn.disabled=true; btn.innerHTML=ic('download')+'<span>변환 중…</span>';
  try{
    // 이미지 굽기 (static 객체 기준): 블렌드 있으면 뒤 배경과 합성해 평탄화, 보정만 있으면 필터만 굽기(투명 유지)
    const baked=new Map(); const jobs=[];
    for(const pg of DECK){ for(const s of pg.model.statics){ if(s.type!=='rect'||!s.img)continue;
      if(s.blend&&s.blend!=='normal') jobs.push(bakeComposite(pg.model,s).then(u=>baked.set(s,u)));
      else if(hasAdj(s.adj)) jobs.push(bakeImage(s.img,s.adj).then(u=>baked.set(s,u))); } }
    await Promise.all(jobs);
    const first=LIB.sizes[DECK[0].model.size]||LIB.sizes['16:9']; const pptx=new PptxGenJS(); pptx.defineLayout({name:'LY',width:first.inW,height:first.inH}); pptx.layout='LY';
    for(const pg of DECK){ const m=pg.model; const z=LIB.sizes[m.size]||first; const PX2IN=z.inW/m.w,PX2PT=(z.inW*72)/m.w; const slide=pptx.addSlide(); slide.background={color:hx(m.bg)}; if(m.notes&&m.notes.trim())slide.addNotes(m.notes);
      for(const r of layout(m)){ const base={x:r.x*PX2IN,y:r.y*PX2IN,w:r.w*PX2IN,h:r.h*PX2IN}; const tr=(r.opacity!=null&&r.opacity<1)?Math.round((1-r.opacity)*100):0; if(r.type==='rect'){ if(r.img){ const io={data:(baked.get(r.src)||r.img),x:base.x,y:base.y,w:base.w,h:base.h}; if(tr)io.transparency=tr; slide.addImage(io); } else { const o=Object.assign({},base,{fill:{color:hx(r.fill)}});if(tr)o.fill.transparency=tr;if(r.line)o.line={color:hx(r.line.color),width:Math.max(0.5,r.line.w*PX2PT)};else o.line={type:'none'};const sh=(r.radius>0)?pptx.ShapeType.roundRect:pptx.ShapeType.rect;if(r.radius>0)o.rectRadius=Math.min(0.2,r.radius*PX2IN);slide.addShape(sh,o); } }else{ const txt=(r.runs&&r.runs.length>1)? r.runs.map(run=>({text:run.text,options:{color:hx(run.color||r.color),bold:((run.weight!=null?run.weight:r.weight)>=600)}})) : r.text; slide.addText(txt,Object.assign({},base,{fontFace:(r.font&&FONTS[r.font])?FONTS[r.font].face:fontFace(),fontSize:r.size*PX2PT,bold:r.weight>=600,color:hx(r.color),transparency:tr,align:r.align,valign:(r.valign==='middle'?'middle':(r.valign==='bottom'?'bottom':'top')),lineSpacingMultiple:r.lh,margin:0,autoFit:false,wrap:true})); } } }
    await pptx.writeFile({fileName:'deck_'+DECK.length+'pages.pptx'});
  }catch(e){ alert('PPTX 변환 실패: '+(e&&e.message||e)); }
  btn.disabled=false; btn.innerHTML=old;
};

  grid.innerHTML=''; const list=LIB.templates||[];
  if(!list.length){ grid.innerHTML='<div class="empty" style="grid-column:1/-1;text-align:center;padding:48px;color:var(--muted)">아직 등록된 템플릿이 없습니다. 위의 <b>＋ 빈 페이지로 시작</b>을 눌러주세요.</div>'; return; }
  for(const tp of list){ const card=document.createElement('div'); card.className='scard';
    const p0=tp.pages[0]; const thumb=document.createElement('div'); thumb.className='sthumb'; previewInto(thumb, p0, 240, p0.preview||tp.cover);
    const body=document.createElement('div'); body.className='sbody'; body.innerHTML='<div class="nm">'+tp.name+'</div><div class="ds">'+tp.docType+' · '+tp.pages.length+'p · '+WORK_SIZE+'</div>';
    card.appendChild(thumb); card.appendChild(body); card.onclick=()=>chooseStartTemplate(tp.id); grid.appendChild(card); }
}
function showStartScreen(){ buildStartGrid(); document.getElementById('startScreen').classList.add('open'); }
function hideStartScreen(){ document.getElementById('startScreen').classList.remove('open'); try{ localStorage.setItem('pptStarted','1'); }catch(_){} }
function chooseStartTemplate(id){ const tp=LIB.templates.find(t=>t.id===id); if(!tp)return; DECK=tp.pages.map(m=>newPage(convertModelSize(m,WORK_SIZE),m.kind)); current=0; selectPage(0); switchTab('insp'); commit(); hideStartScreen(); }
function chooseBlankStart(){ DECK=[newPage(blankModel(WORK_SIZE),'빈 페이지')]; current=0; selectPage(0); switchTab('insp'); commit(); hideStartScreen(); }
document.getElementById('startBlank').onclick=chooseBlankStart;
(function(){ let first=true; try{ first=!localStorage.getItem('pptStarted'); }catch(_){} if(first) showStartScreen(); })();

// ===== 키보드 단축키 안내 (⌘/) =====
(function(){
  const SC=[
    ['편집',[ ['복사',['⌘','C']],['잘라내기',['⌘','X']],['붙여넣기',['⌘','V']],['복제',['⌘','D']],['삭제',['Del']],['실행 취소',['⌘','Z']],['다시 실행',['⌘','⇧','Z']] ]],
    ['선택 · 그룹',[ ['전체 선택',['⌘','A']],['그룹 만들기',['⌘','G']],['그룹 해제',['⌘','⇧','G']],['다중 선택',['Shift','클릭']],['영역 선택',['빈 곳 드래그']] ]],
    ['이동 · 복제',[ ['직선 이동',['Shift','드래그']],['드래그 복제',['Alt','드래그']],['텍스트 편집',['더블클릭']] ]],
    ['보기 · 줌',[ ['확대',['⌘','+']],['축소',['⌘','-']],['화면 맞춤',['⌘','0']],['포인터 줌',['⌘','휠']],['손 도구(패닝)',['Space','드래그']],['이전/다음 페이지',['휠']],['단축키 보기',['⌘','/']] ]],
  ];
  const grid=document.getElementById('scGrid'), ov=document.getElementById('shortcuts');
  function build(){ grid.innerHTML=''; for(const cat of SC){ const h=document.createElement('div'); h.className='scCat'; h.textContent=cat[0]; grid.appendChild(h);
    for(const row of cat[1]){ const r=document.createElement('div'); r.className='scRow'; r.innerHTML='<span>'+row[0]+'</span><span class="keys">'+row[1].map(k=>'<kbd>'+k+'</kbd>').join('')+'</span>'; grid.appendChild(r); } } }
  function close(){ ov.classList.remove('open'); }
  function toggle(){ if(ov.classList.contains('open')){ close(); } else { build(); ov.classList.add('open'); } }
  document.getElementById('scClose').onclick=close;
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='/'){ e.preventDefault(); toggle(); } else if(e.key==='Escape'&&ov.classList.contains('open')){ close(); } });
})();

// ===== 원격 라이브러리 라이브 동기화 — Vercel /api/library =====
// 교체(merge 아님)로 플러그인 삭제가 바로 반영. 탭 복귀/포커스 시 즉시, 보이는 동안 폴링.
(function(){
  let busy=false, lastSig=null;
  const sig=(lib)=>(lib.templates||[]).map(t=>t.id).join(',')+'|'+(lib.elements||[]).map(e=>e.id).join(',')+'|'+(lib.templates||[]).length+(lib.elements||[]).length;
  async function syncLibrary(force){
    if(busy)return; busy=true;
    try{
      const r=await fetch('/api/library',{cache:'no-store'});
      if(r.ok){ const lib=await r.json();
        if(lib && (lib.templates||lib.elements)){
          const s=sig(lib);
          if(force||s!==lastSig){ lastSig=s; LIB.templates=lib.templates||[]; LIB.elements=lib.elements||[];
            buildTplGrid(); buildElGrid();
            if(document.getElementById('startScreen').classList.contains('open')) buildStartGrid();
          }
        }
      }
    }catch(_){}
    busy=false;
  }
  window.__syncLibrary=syncLibrary;
  syncLibrary(true);                                   // 최초 로드
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncLibrary(); });
  window.addEventListener('focus',()=>syncLibrary());  // 피그마→브라우저 전환 시 즉시
  setInterval(()=>{ if(document.visibilityState==='visible') syncLibrary(); }, 15000);  // 백업 폴링
})();
</script>
